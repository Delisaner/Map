<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивная карта</title>
<style>
  :root{
    --bg: #0f1419;
    --panel: #1a2029;
    --panel-2: #212836;
    --accent: #ff6b4a;
    --accent-2: #ffa54a;
    --text: #f0f2f5;
    --text-dim: #9aa4b2;
    --border: #2c3542;
    --shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden;
  }

  /* ===== Top bar ===== */
  #topbar{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background:rgba(15,20,25,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  #topbar .title{font-weight:700; font-size:16px; letter-spacing:.3px;}
  #topbar .title span{color:var(--accent);}
  #controls{display:flex; gap:10px; align-items:center;}
  button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    padding:9px 16px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
    transition:.15s ease; white-space:nowrap;
  }
  button:hover{border-color:var(--accent); color:var(--accent-2);}

  /* ===== Map area ===== */
  #mapWrap{
    position:absolute; inset:0; top:60px;
    display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:30px;
  }
  #mapContainer{
    position:relative; display:inline-block; line-height:0;
    box-shadow:var(--shadow); border-radius:8px; overflow:hidden;
    border:1px solid var(--border);
  }
  #mapImg{display:block; max-width:85vw; max-height:80vh; user-select:none; -webkit-user-drag:none;}
  #placeholder{
    color:var(--text-dim); text-align:center; font-size:14px; padding:60px;
    border:2px dashed var(--border); border-radius:12px;
  }

  /* ===== Markers ===== */
  .marker{
    position:absolute; width:26px; height:26px; margin-left:-13px; margin-top:-26px;
    cursor:pointer; z-index:10; transform-origin:bottom center;
    animation:drop .35s ease;
  }
  @keyframes drop{ from{transform:translateY(-14px) scale(.4); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;} }
  .marker svg{width:100%; height:100%; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));}
  .marker .pin-body{fill:url(#pinGrad); stroke:#fff; stroke-width:1.2;}
  .marker:hover{transform:scale(1.15);}
  .marker .pulse{
    position:absolute; left:50%; top:100%; width:10px; height:10px; margin-left:-5px; margin-top:-8px;
    border-radius:50%; background:var(--accent); opacity:.5;
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.6); opacity:.6;}
    70%{transform:scale(2.4); opacity:0;}
    100%{opacity:0;}
  }

  /* ===== Viewer card ===== */
  #overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:70;
    display:none; align-items:center; justify-content:center;
  }
  #overlay.show{display:flex;}
  #viewCard{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    width:min(440px, 88vw); 
    max-height: 80vh; /* Ограничиваем карточку по высоте экрана */
    padding:26px; box-shadow:var(--shadow);
    display: flex; flex-direction: column; /* Вертикальная гибкая раскладка */
    animation:cardIn .2s ease;
  }
  @keyframes cardIn{ from{transform:translateY(10px) scale(.97); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;} }
  
  /* Фиксированное заглавие не уезжает при скролле */
  #viewCard h2{
    margin:0 0 14px; font-size:22px; 
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    flex-shrink: 0; 
  }
  
  /* Контейнер для текста с вертикальным скроллом */
  .descContainer{
    overflow-y: auto; 
    padding-right: 6px; 
    margin-bottom: 16px;
  }
  #viewCard p{margin:0; color:var(--text-dim); line-height:1.55; font-size:14.5px; white-space:pre-wrap;}
  #viewCard .closeCard{width:100%; flex-shrink: 0;}

  /* ===== List of countries ===== */
  #listPanel{
    position:fixed; left:0; top:60px; bottom:0; width:230px; background:var(--panel);
    border-right:1px solid var(--border); z-index:55; overflow-y:auto; padding:14px;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  #listPanel.open{transform:translateX(0);}
  #listPanel h3{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:4px 0 12px;}
  .listItem{
    padding:10px 12px; border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:13.5px;
    border:1px solid transparent; background:var(--panel-2); display:flex; justify-content:space-between; gap:6px;
  }
  .listItem:hover{border-color:var(--accent);}
  .listItem .idx{color:var(--text-dim); font-size:11px;}
  #emptyMsg{color:var(--text-dim); font-size:12.5px; text-align:center; margin-top:20px;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="title">🗺️ <span>Интерактивная карта</span></div>
  <div id="controls">
    <button id="listToggle">📋 Список стран</button>
  </div>
</div>

<div id="listPanel">
  <h3>Список стран</h3>
  <div id="listItems"></div>
  <div id="emptyMsg">Меток на карте нет.</div>
</div>

<div id="mapWrap">
  <div id="mapContainer">
    <img id="mapImg" src="map.png" alt="Карта"
         onerror="document.getElementById('mapContainer').innerHTML='<div id=&quot;placeholder&quot;>⚠️ Файл map.png не найден.</div>'">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff8a5c"/>
          <stop offset="100%" stop-color="#ff6b4a"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</div>

<!-- View card overlay -->
<div id="overlay">
  <div id="viewCard">
    <h2 id="viewName"></h2>
    <div class="descContainer">
      <p id="viewDesc"></p>
    </div>
    <button class="closeCard" id="closeCardBtn">Закрыть</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'interactiveMapData_v1';
  let markers = [];

  const mapImg = document.getElementById('mapImg');
  const mapContainer = document.getElementById('mapContainer');
  const listPanel = document.getElementById('listPanel');
  const listItems = document.getElementById('listItems');
  const emptyMsg = document.getElementById('emptyMsg');
  const overlay = document.getElementById('overlay');

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const data = JSON.parse(raw);
        markers = data.markers || [];
      }
    }catch(e){ console.warn('Ошибка загрузки данных', e); }
  }

  function renderMarkers(){
    mapContainer.querySelectorAll('.marker').forEach(el=>el.remove());
    markers.forEach(m=>{
      const el = document.createElement('div');
      el.className = 'marker';
      el.style.left = m.xPct + '%';
      el.style.top = m.yPct + '%';
      el.dataset.id = m.id;
      el.innerHTML = `
        <div class="pulse"></div>
        <svg viewBox="0 0 24 24">
          <path class="pin-body" d="M12 0C6.5 0 2 4.5 2 10c0 7 10 14 10 14s10-7 10-14c0-5.5-4.5-10-10-10z"/>
          <circle cx="12" cy="10" r="4" fill="#1a2029"/>
        </svg>`;
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        openCard(m.id);
      });
      mapContainer.appendChild(el);
    });
  }

  function renderList(){
    listItems.innerHTML = '';
    emptyMsg.style.display = markers.length ? 'none' : 'block';
    markers.forEach((m, i)=>{
      const div = document.createElement('div');
      div.className = 'listItem';
      div.innerHTML = `<span>${escapeHtml(m.name)}</span><span class="idx">#${i+1}</span>`;
      div.addEventListener('click', ()=> openCard(m.id));
      listItems.appendChild(div);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function openCard(id){
    const m = markers.find(x=>x.id===id);
    if(!m) return;
    document.getElementById('viewName').textContent = m.name || 'Без названия';
    document.getElementById('viewDesc').textContent = m.description || 'Описание отсутствует.';
    
    // Сбрасываем скролл на самый верх при открытии новой карточки
    const descBox = document.querySelector('.descContainer');
    if(descBox) descBox.scrollTop = 0;

    overlay.classList.add('show');
  }

  document.getElementById('closeCardBtn').addEventListener('click', ()=>overlay.classList.remove('show'));
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); });

  document.getElementById('listToggle').addEventListener('click', ()=>{
    listPanel.classList.toggle('open');
  });

  load();
  mapImg.addEventListener('load', ()=>{ renderMarkers(); renderList(); });
  if(mapImg.complete && mapImg.naturalWidth){ renderMarkers(); renderList(); }
})();
</script>
</body>
</html>
